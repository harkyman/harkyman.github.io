<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PiperNews</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #555555;
            --hover-bg: #2d2d2d;
            --accent-color: #4da3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
            padding: 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid var(--border-color);
        }

        /* Topic Band Header */
        .topic-band {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .topic-title {
            padding: 14px 16px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .topic-title:hover {
            background-color: var(--hover-bg);
        }

        /* Smooth Expand/Collapse Wrappers */
        .expandable-wrapper {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            transition: grid-template-rows 100ms ease-in-out, opacity 100ms ease-in-out;
        }

        .expandable-wrapper.open {
            grid-template-rows: 1fr;
            opacity: 1;
        }

        .expandable-inner {
            overflow: hidden;
            min-height: 0;
        }

        /* Expandable Topic Content */
        .topic-content {
            padding-left: 15px;
            background-color: #181818;
            border-top: 1px solid #2a2a2a;
        }

        /* Topic Headline & Summary */
        .topic-headline-box {
            border-bottom: 1px solid #2a2a2a;
        }

        .topic-headline {
            padding: 10px 12px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            background-color: #242424;
        }

        .topic-headline:hover {
            background-color: #2e2e2e;
        }

        .topic-summary {
            padding: 12px;
            font-size: 0.9rem;
            color: #cccccc;
            background-color: #1e1e1e;
            border-left: 3px solid var(--border-color);
            margin: 8px 0;
        }

        /* Article Items */
        .article-box {
            border-bottom: 1px solid #2a2a2a;
        }

        .article-title {
            padding: 10px 12px;
            font-size: 0.95rem;
            cursor: pointer;
            user-select: none;
        }

        .article-title:hover {
            background-color: var(--hover-bg);
        }

        .article-body {
            padding: 12px;
            background-color: #1e1e1e;
            font-size: 0.88rem;
            color: var(--text-secondary);
            border-top: 1px dashed #333333;
            border-left: 3px solid var(--border-color);
        }

        .article-body a {
            display: inline-block;
            margin-top: 8px;
            color: var(--accent-color);
            text-decoration: underline;
            word-break: break-all;
        }

        /* Older Articles Section */
        .older-toggle {
            padding: 10px 12px;
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-secondary);
            background-color: #252525;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #333333;
        }

        .older-toggle:hover {
            background-color: #303030;
        }

        .empty-notice {
            padding: 10px 12px;
            font-style: italic;
            color: #777777;
            font-size: 0.9rem;
        }

        .tag {
            font-size: 0.5rem;
            background-color: #444444;
            color: #e0e0e0;
            padding: 2px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <header>
        <h1>PiperNews</h1>
    </header>

    <main class="topic-list">
        <div class="empty-notice">No active topics.</div>

    </main>

    <script>
        function toggleExpand(element) {
            // Find the next sibling element which holds the details to show/hide
            const nextContent = element.nextElementSibling;
            if (nextContent) {
                // Toggles the class that initiates the CSS Grid row transition
                nextContent.classList.toggle('open');
            }
        }
    </script>
</body>
</html>
